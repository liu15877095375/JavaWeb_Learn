<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tlias智能学习辅助系统</title>
    <link rel="stylesheet" href="css/LearnSystem.css" />
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="nav-title">Tlias智能学习辅助系统</div>
        <a href="#" class="logout-link">退出登录</a>
    </div>

    <!-- 页面主体容器 -->
    <div class="page-container">
        <!-- 搜索筛选区域 -->
        <div class="search-card">
            <form action="/save" method="post" class="search-wrap">
                <div class="search-item">
                    <label for="name">姓名</label>
                    <input type="text" name="name" id="name" />
                </div>

                <div class="search-item">
                    <label for="gender">性别</label>
                    <select name="gender" id="gender">
                        <option value="">请选择</option>
                        <option value="1">男</option>
                        <option value="2">女</option>
                    </select>
                </div>

                <div class="search-item">
                    <label for="position">职位</label>
                    <select name="position" id="position">
                        <option value="">请选择</option>
                        <option value="1">班主任</option>
                        <option value="2">讲师</option>
                        <option value="3">学工主管</option>
                        <option value="4">教研主管</option>
                        <option value="5">咨询师</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">查询</button>
                    <button type="reset" class="btn btn-default">清空</button>
                </div>
            </form>
        </div>

        <!-- 数据表格 -->
        <div class="table-card">
            <table class="info-table">
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>头像</th>
                        <th>职位</th>
                        <th>入职日期</th>
                        <th>最后操作时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>李四</td>
                        <td>男</td>
                        <td>
                            <img src="img/2.jpg" alt="头像" class="avatar" />
                        </td>
                        <td>校长</td>
                        <td>2026</td>
                        <td>2026</td>
                        <td>
                            <div class="action-group">
                                <button type="button" class="btn btn-success btn-sm">
                                    编辑
                                </button>
                                <button type="button" class="btn btn-danger btn-sm">
                                    删除
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer-fx">
        <p>飞翔的猪猪熊所有</p>
    </footer>
</body>
</html>
