<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【新思想引领新征程】推进长江十年禁渔 谱写长江大保护新篇章</title>
    <!-- 方式二：内部样式 -->
     <style>
        /* 元素选择器 */
        span{
            color: gray;
        }

        /* 类选择器 */
        .cls{
        color: rgba(255, 0, 0, 1);
        }

        .BTCL{
            color: #333333;
        }

        /* ID选择器 */
        #time{
            color: rgba(178, 178, 178, 1);
        }

        a{
            /* 去除超链接下方的下划线 */
            text-decoration: none;

            color: #576B95;
        }
     </style>

     <!-- 方式三：外部样式 -->
      <link rel="stylesheet" href="css/news.css">
</head>
<body>
    <h1 class="BTCL">【新思想引领新征程】推进长江十年禁渔 谱写长江大保护新篇章</h1>
    <a href="https://www.cctv.com" target="_blank">央视网</a>
    <!-- 方式一：行内样式 -->
    <!-- <span style="color: gray;">2024年05月15日 20:07</span> -->

    <!-- 方式二：内部样式 -->
    <!-- 在head定义了span的style之后，在这里可以直接用 -->
    <!-- <span>2024年05月15日 20:07</span> -->

    <!-- 方式三：外部样式 -->
    <!-- 在head引入了外部样式之后，在这里可以直接用 -->
    <span id="time" class="cls">2024年05月15日 20:07</span>
</body>
</html>

<!-- 方式一是span包style，而方式二是style包span -->
