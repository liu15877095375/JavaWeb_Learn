<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单练习2</title>
</head>
<body>
    <form action="/save" method="post">
        <!-- name是最终提交的名字，可近似理解为键值对的键 -->
        姓名：<input type="text" name="name"><br><br>
        密码：<input type="password" name="password"><br><br>

        性别：
        <!-- radio是单选的意思，value表示的是真正提交的值 -->
         <!-- label标签的作用是点击文字也可以勾选，提升用户体验感 -->
        <label><input type="radio" name="gender" value="1">男</label>
        <label><input type="radio" name="gender" value="2">女</label>
        <br><br>

        爱好：
        <!-- checkbox是多选的意思，value表示的是真正提交的值 -->
        <label><input type="checkbox" name="hobby" value="1">篮球</label>
        <label><input type="checkbox" name="hobby" value="2">骑行</label>
        <label><input type="checkbox" name="hobby" value="3">编程</label>
        <br><br>

        个人相片：<input type="file" name="image"><br><br>

        生日：<input type="date" name="birthday"><br><br>

        学历：
        <select name="degree">
            <option value="1">专科</option>
            <option value="2">本科</option>
            <option value="3">硕士</option>
            <option value="4">博士</option>
        </select>
        <br><br>

        个人描述：
        <br>
        <!-- cols可以理解为列，rows可以理解为行 -->
        <textarea name="description" cols="30" rows="10"></textarea>
        <br><br>

        <!-- 提交按钮 -->
         <input type="submit" value="提交">

         <!-- 重置按钮 -->
          <input type="reset" value="重置">
    </form>
</body>
</html>
